name: Unpack ViralPilot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -d "extracted/appsrc" ]; then
            cp -R extracted/appsrc/. .
          else
            cp -R extracted/. .
          fi

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Unpack ViralPilot project" || echo "Nothing to commit"
          git push
