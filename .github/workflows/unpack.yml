name: Unpack ViralPilot

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 0
          fi

          rm -rf .unpacked
          mkdir .unpacked

          unzip -q "$ZIP_FILE" -d .unpacked

          if [ -f ".unpacked/package.json" ]; then
            cp -a .unpacked/. .
          else
            PROJECT_DIR=$(find .unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/package.json" ]; then
              cp -a "$PROJECT_DIR"/. .
            else
              echo "Could not locate project files."
              exit 1
            fi
          fi

          rm -rf .unpacked
          rm -f "$ZIP_FILE"

      - name: Commit project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: unpack ViralPilot V1.4"
          git push
